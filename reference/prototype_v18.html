<style>
:root{

  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){

    --accent:#6fb8d2; --accent-ink:#0d1a20; --accent-soft:#1a3240;
    --ok:#79c79a; --ok-soft:#173226; --warn:#e2b061; --warn-soft:#382a12; --bad:#ef8f86; --bad-soft:#3a1d1a;
    --paper:#1f272b; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11181c; --card:#182228; --ink:#e3eaee; --muted:#9aaab3; --line:#2c3a42;
  --accent:#6fb8d2; --accent-ink:#0d1a20; --accent-soft:#1a3240;

}

<body>
<header class="top" id="top"></header>
<div class="updbar" id="updbar"></div>
<main id="main" tabindex="-1"><div class="auth card"><p>系統載入中…</p></div></main>
<p class="sim-note" id="simNote">目前為模擬環境：資料尚未正式介接 Supabase 與 HAPI FHIR。</p>
<div id="toasts" role="status" aria-live="polite"></div>
<div id="modal"></div>

<script>
'use strict';
/* =========================================================
 * 基本工具
 * ========================================================= */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
/* 時間一律以台灣時間（Asia/Taipei）記錄與顯示，不受使用者電腦時區影響。
 * 儲存格式維持 YYYY/MM/DD HH:MM（字串可直接比較先後）；新增的事件另存 ts（毫秒）。 */
const TZ = 'Asia/Taipei';
function twParts(d){
  try { const o = {}; new Intl.DateTimeFormat('en-CA', {timeZone:TZ, year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', hourCycle:'h23'}).formatToParts(d || new Date()).forEach(p => { o[p.type] = p.value; }); if (o.hour === '24') o.hour = '00'; return o; }
  catch (e){ const x = d || new Date(); return {year:String(x.getFullYear()), month:pad(x.getMonth()+1), day:pad(x.getDate()), hour:pad(x.getHours()), minute:pad(x.getMinutes())}; }
}
function todayStr(){ const p = twParts(); return `${p.year}-${p.month}-${p.day}`; }
function stamp(){ const p = twParts(); return `${p.year}/${p.month}/${p.day} ${p.hour}:${p.minute}`; }
const d2n = s => { const [y,m,d] = s.split('-').map(Number); return Date.UTC(y, m-1, d) / 864e5; };
const addDays = (s, n) => new Date((d2n(s) + n) * 864e5).toISOString().slice(0, 10);
const slash = s => s ? s.replace(/-/g, '/') : '';
const md = s => s ? `${Number(s.slice(5,7))}/${Number(s.slice(8,10))}` : '';
const clone = o => JSON.parse(JSON.stringify(o));
const isDate = s => /^\d{4}-\d{2}-\d{2}$/.test(s || '');
const hex = buf => [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
async function hashPw(pw, saltHex){
  const salt = new Uint8Array(saltHex.match(/../g).map(h => parseInt(h, 16)));
  const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({name:'PBKDF2', hash:'SHA-256', salt, iterations:100000}, key, 256);
  return hex(bits);
}
const newSalt = () => hex(crypto.getRandomValues(new Uint8Array(16)));
const pwOk = p => typeof p === 'string' && p.length >= 8 && /[A-Za-z]/.test(p) && /\d/.test(p);
const emailOk = e => /^[A-Za-z0-9._+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/.test(e || '');
const nidOk = s => /^[A-Z][12A-D89]\d{8}$/.test(s || '');
const ROLE_NAME = {family:'家屬／申請人', staff:'行政／社工', nurse:'護理人員', care:'照顧服務員', admin:'系統管理員'};

/* =========================================================
 * 資料層（Claude 頁面資料庫）
 * ========================================================= */
/* 資料結構第 2 版：F8 核對草稿（reviewDrafts）與 OCR 工作結果（ocrRuns）和文件主資料（items）分開存放 */
const SCHEMA_VERSION = 2;
/* ---------- 文件顯示名稱 ----------
 * 內建文件依內部 key 顯示名稱：機構端（行政、護理、照服員、管理員）用正式名稱，家屬端用較好懂的名稱。
 * 資料庫中的 name 欄位不改寫（保留建立當時的名稱），操作紀錄與歷史通知也保留當時的文字。
 * 行政新增的個案文件（key 不在表內）照原本的名稱顯示。 */
const STAFF_NAME = {"idcopy": "住民身分證明文件", "nhi": "健保卡", "signerId": "簽約者身分證明文件", "relProof": "戶籍資料或代理權限證明", "exam": "入住前健康檢查報告", "xray": "胸部 X 光報告", "stool": "糞便檢驗報告", "otherExam": "其他指定檢查報告", "summary": "出院病歷摘要／近期就醫摘要", "meds": "目前用藥清單或處方資料", "diag": "診斷證明書", "labs": "近期檢驗及影像報告", "followup": "回診預約資料／後續追蹤醫囑", "tubeCare": "管路留置與照護紀錄", "woundCare": "傷口評估與照護紀錄", "rehab": "復健及行動能力紀錄", "swallow": "吞嚥功能評估與飲食建議", "elim": "排泄與睡眠相關照護紀錄", "emergency": "緊急事故處理同意書", "authOther": "其他機構指定之授權文件", "contract": "住宿式長照服務契約", "fee": "服務收費明細", "payReceipt": "繳費收據", "deposit": "保證金繳納紀錄／收據"};
const FAMILY_NAME = {"idcopy": "住民身分證明文件", "tubeCare": "管路照護資料", "woundCare": "傷口照護資料", "rehab": "復健及行動能力資料", "swallow": "吞嚥與飲食資料", "elim": "排泄與睡眠照護資料"};
const famName = it => it ? (FAMILY_NAME[it.key] || STAFF_NAME[it.key] || it._dbName || it.name) : '';
function itemName(it){ if (typeof me !== 'undefined' && me && me.role === 'family' && FAMILY_NAME[it.key]) return FAMILY_NAME[it.key]; return STAFF_NAME[it.key] || it._dbName || ''; }
function nameItem(o){
  if (!o || typeof o !== 'object' || Object.prototype.hasOwnProperty.call(o, '_dbName')) return o;
  Object.defineProperty(o, '_dbName', {value:o.name, writable:true, enumerable:false, configurable:true});
  Object.defineProperty(o, 'name', {get(){ return itemName(this); }, set(v){ this._dbName = v; }, enumerable:true, configurable:true});
  return o;
}
/* 寫回資料庫時一律使用資料庫原本的名稱，不會寫入任何角色的顯示名稱 */
const dbName = it => it ? (Object.prototype.hasOwnProperty.call(it, '_dbName') ? it._dbName : it.name) : '';
function rawItem(o){ const r = clone(o); if (o && Object.prototype.hasOwnProperty.call(o, '_dbName')) r.name = o._dbName; return r; }
const srcName = f => { if (!f) return ''; const it = D.items[f.id || f.itemId]; return (it && it.name) || f.name || ''; };
const itemsMap = m => { Object.values(m).forEach(nameItem); return new Proxy(m, {set(t, k, v){ t[k] = nameItem(v); return true; }}); };
const D = { accounts:{}, cases:{}, items:itemsMap({}), notices:{}, logs:[], settings:null, drafts:{}, ocr:{}, mail:{} };
const loaded = { accounts:false, cases:false, items:false, notices:false, logs:false, settings:false, drafts:false, ocr:false, mail:false };
let db = null, uid = null, me = null, booted = false, dbFailed = false, sampleApi = null, sampleImages = false;
const route = { page:null, arg:null };
let formDirty = false, pendingRender = false;

async function put(path, data){
  try { await db.doc(path).set(path.startsWith('items/') ? rawItem(data) : data); return true; }
  catch (e){ reportWriteError(e); return false; }
}
async function del(path){ try { await db.doc(path).delete(); return true; } catch (e){ reportWriteError(e); return false; } }
function reportWriteError(e){
  const code = e && e.code;
  const msg = code === 'quota_exceeded' ? '資料庫空間已滿，請聯絡系統管理員。' : code === 'invalid_argument' ? '您沒有修改資料的權限，請聯絡系統管理員確認您對此頁面的使用權限。' : '儲存失敗，請稍後再試。';
  toast(msg);
}
/* ---------- 通知與操作紀錄 ----------
 * 主要操作成功後才寫通知與紀錄。寫入失敗時：不顯示「已通知」，改成提示失敗，並放進「待送清單」
 * （記憶體＋盡量寫到案件 outbox，讓其他人重新整理後也看得到）。重試用同一個文件 id 寫入，不會重複，也不會重做主要操作（例如補件要求）。 */
const outbox = [];
async function outboxAdd(e){
  e.by = e.by || (me ? me.id : '');
  if (!outbox.some(x => x.path === e.path && x.kind === e.kind)) outbox.push(e);
  if (e.caseId && D.cases[e.caseId]){ const r = await mutateCase(e.caseId, x => { x.outbox = (x.outbox || []).filter(y => !(y.path === e.path && y.kind === e.kind)).concat([{path:e.path, kind:e.kind, data:e.data || null, mark:e.mark || null, label:e.label, error:e.error, at:e.at, by:e.by}]); }); e.persisted = r.ok; }
  scheduleOutboxBar();
}
/* 通知成功的時間記在對應的決定上（評估結果、結案）。只在通知文件確實寫入後才記，與「處理決定時間」分開 */
async function markNotice(caseId, mark, ok, path){
  const r = await mutateCase(caseId, x => {
    let hit = 0;
    (mark.fields || []).forEach(f => { const o = x[f]; if (!o) return; if (o.noticePath && o.noticePath !== path) return; hit++;
      o.noticePath = path;
      if (ok){ o.notifiedAt = stamp(); delete o.notifyFailedAt; } else { o.notifyFailedAt = stamp(); delete o.notifiedAt; } });
    if (!hit) return '對應的決定已改變';
  });
  return r;
}
function scheduleOutboxBar(){ const el = document.getElementById('outboxBar'); if (el) el.outerHTML = outboxBar(); else if (me) { const m = document.getElementById('main'); if (m) m.insertAdjacentHTML('afterbegin', outboxBar()); } }
async function addLog(caseId, what){
  const path = 'logs/' + db.collection('logs').doc().id, data = { caseId: caseId || '', who: me ? me.name + '（' + ROLE_NAME[me.role] + '）' : '系統', what, at: stamp(), ts: Date.now() };
  if (await put(path, data)) return true;
  await outboxAdd({kind:'log', path, data, caseId:caseId || '', label:'操作紀錄：' + what, error:'寫入失敗', at:stamp()});
  toast('操作已完成，但操作紀錄寫入失敗，已保留在畫面上方的待送清單，可以按「重試」。'); return false;
}
async function notifyFamily(c, text, mark){
  const path = 'notices/' + db.collection('notices').doc().id, data = { caseId: c.id, to: c.familyId, text, at: stamp(), ts: Date.now(), read: false };
  setTimeout(() => { if (D.cases[c.id]) syncReqMails(D.cases[c.id]).catch(() => {}); }, 0);
  if (await put(path, data)){
    if (mark){ const m = await markNotice(c.id, mark, true, path); if (!m.ok && m.reason !== '對應的決定已改變'){ await outboxAdd({kind:'mark', path, mark, caseId:c.id, label:`通知已送出，但通知時間沒有記錄：${text}`, error:m.reason, at:stamp()}); } }
    return true;
  }
  if (mark) await markNotice(c.id, mark, false, path);
  await outboxAdd({kind:'notice', path, data, mark: mark || null, caseId:c.id, label:`給${accName(c.familyId)}的通知：${text}`, error:'寫入失敗', at:stamp()});
  toast('操作已完成，但「通知家屬」失敗，家屬目前收不到這則通知。已保留在畫面上方的待送清單，可以按「重試」。'); return false;
}
/* 目前使用者看得到的待送項目：本次操作留下的＋案件上保存的（行政、管理員看全部；護理看負責的案件） */
/* 誰看得到哪些待送項目（畫面限制，不能取代資料庫端權限）：
 * 行政、管理員：所有案件的項目；護理：自己負責案件的項目；家屬、照服員：只看自己操作留下、且屬於自己案件的項目。
 * 沒有案件的項目（例如機構設定紀錄）只給當初操作的人。記憶體與案件上保存的項目用同一套規則過濾，換帳號後不會帶到別人畫面。 */
function outboxVisible(e){
  if (!me) return false;
  const c = e.caseId ? D.cases[e.caseId] : null;
  if (!e.caseId) return e.by === me.id;
  if (!c) return false;
  if (['staff','admin'].includes(me.role)) return true;
  if (me.role === 'nurse') return c.nurseId === me.id;
  if (me.role === 'family') return c.familyId === me.id && e.by === me.id;
  return e.by === me.id && e.kind === 'log';
}
function outboxList(){
  if (!me) return [];
  const list = [];
  const addE = e => { if (outboxVisible(e) && !list.some(x => x.path === e.path && x.kind === e.kind)) list.push(e); };
  outbox.forEach(addE);
  Object.values(D.cases).forEach(c => (c.outbox || []).forEach(e => addE(Object.assign({caseId:c.id}, e))));
  return list;
}
function outboxBar(){
  const L = outboxList(); if (!L.length) return '<div id="outboxBar" hidden></div>';
  return `<div class="notice bad stack" id="outboxBar" role="alert" style="margin-bottom:14px"><div class="row between"><strong>有 ${L.length} 筆通知或操作紀錄沒有送出</strong><button type="button" class="btn sm primary" data-act="outbox-retry">重試</button></div><ul class="small" style="margin:0;padding-left:1.2em">${L.map(e => `<li>${esc((D.cases[e.caseId] || {patient:{}}).patient.name || '')} ${esc(e.label)}（${esc(e.at)}，${esc(e.error)}）</li>`).join('')}</ul><span class="small muted">重試只會補送通知或紀錄，不會重做原本的操作。</span></div>`;
}
async function saveItem(it){ const copy = rawItem(it); delete copy.id; return put('items/' + it.id, copy); }

/* =========================================================
 * 寫入協調（第一階段）
 * Claude 頁面資料庫沒有交易，只有「短期租約」。這裡用：
 *   同一份文件的寫入排同一個佇列 → 取得租約 → 從資料庫重讀最新內容
 *   → 檢查版本與前置條件 → 在最新內容上修改 → 寫入 → 成功才更新畫面資料
 * 租約只協調使用這套程式的人，不是原子性保證；正式版需改用 Supabase 交易與條件式更新。
 * ========================================================= */
const TAB_ID = 'tab-' + Math.random().toString(36).slice(2, 10);
const queues = {};
function enqueue(key, fn){ const prev = queues[key] || Promise.resolve(); const p = prev.then(fn, fn); queues[key] = p.catch(() => {}); return p; }
const waitQueue = key => queues[key] || Promise.resolve();
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function withLease(path){
  for (let n = 0; n < 8; n++){
    try { const r = await db.doc(path).acquire({holder: TAB_ID, ttlMs: 5000}); if (r && r.acquired) return true; }
    catch (e){ if (e && ['invalid_argument','revoked','not_granted','capability_disabled','capability_removed'].includes(e.code)) return false; }
    await sleep(250 + Math.random() * 400 + n * 150);
  }
  return false;
}
const wkey = (itemId, v) => itemId + '__v' + v;
const WRITE_FAIL = {lease:'其他人正在處理這份文件，請稍後再試', gone:'找不到這份文件，可能已被移除', version:'文件已有新版本，請重新開啟後再操作', write:'資料庫寫入失敗，資料尚未保存'};
/* 修改一份文件項目：expectV＝預期的最新版本號（null 表示不檢查）；fn(最新資料, 最新版本) 回傳字串表示前置條件不符而中止 */
function mutateItem(itemId, expectV, fn){
  return enqueue('item:' + itemId, async () => {
    if (!(await withLease('items/' + itemId))) return {ok:false, reason:WRITE_FAIL.lease};
    let snap;
    try { snap = await db.doc('items/' + itemId).get(); } catch (e){ return {ok:false, reason:WRITE_FAIL.write}; }
    if (!snap.exists) return {ok:false, reason:WRITE_FAIL.gone};
    const fresh = Object.assign({id:itemId}, clone(snap.data()));
    const last = fresh.versions && fresh.versions.length ? fresh.versions[fresh.versions.length - 1] : null;
    if (expectV != null && (!last || last.v !== expectV)) return {ok:false, reason:WRITE_FAIL.version};
    const bad = fn(fresh, last);
    if (typeof bad === 'string') return {ok:false, reason:bad};
    const body = rawItem(fresh); delete body.id;
    try { await db.doc('items/' + itemId).set(body); } catch (e){ reportWriteError(e); return {ok:false, reason:WRITE_FAIL.write}; }
    D.items[itemId] = fresh;
    return {ok:true, item:fresh};
  });
}
/* 案件、帳號等其他主資料：同樣「排隊 → 租約 → 重讀最新 → 檢查 → 修改 → 寫入 → 成功才更新畫面資料」 */
function mutateDoc(col, id, fn, opt){
  const path = (opt && opt.path) || col;
  return enqueue(path + ':' + id, async () => {
    if (!(await withLease(path + '/' + id))) return {ok:false, reason:WRITE_FAIL.lease};
    let snap;
    try { snap = await db.doc(path + '/' + id).get(); } catch (e){ return {ok:false, reason:WRITE_FAIL.write}; }
    if (!snap.exists) return {ok:false, reason:WRITE_FAIL.gone};
    const fresh = Object.assign({id}, clone(snap.data()));
    const bad = fn(fresh);
    if (typeof bad === 'string') return {ok:false, reason:bad};
    const body = clone(fresh); delete body.id;
    try { await db.doc(path + '/' + id).set(body); } catch (e){ reportWriteError(e); return {ok:false, reason:WRITE_FAIL.write}; }
    if (!(opt && opt.noLocal)) D[col][id] = fresh;
    return {ok:true, doc:fresh, case:fresh};
  });
}
const mutateCase = (id, fn) => mutateDoc('cases', id, fn);
const mutateAccount = (id, fn) => mutateDoc('accounts', id, fn);
/* 寫入失敗訊息（彈出視窗內） */
const failMerr = (what, r) => setErr('merr', `${what}失敗：${(r && r.reason) || WRITE_FAIL.write}。資料沒有變更，可以再試一次。`);
/* 相容舊介面：修改目前版本 */
const setPhaseItem = (it, mut) => mutateItem(it.id, cur(it) ? cur(it).v : null, (x, v) => mut(x, v));
/* 寫入失敗的統一提示 */
const failToast = (what, r) => toast(`${what}失敗：${(r && r.reason) || WRITE_FAIL.write}。資料沒有變更，可以再試一次。`);

/* ---------- 舊資料轉換（第 1 版 → 第 2 版） ----------
 * 第 1 版把核對草稿（reviewDraft）與 OCR 結果（ai、ocr、ocrLog、ocrCount）存在 items 的各版本裡。
 * 轉換步驟（每份文件）：1. 備份原文件到 backups/<文件>__schema1　2. 寫入 reviewDrafts／ocrRuns（已存在則不覆蓋）
 * 3. 前兩步都成功，才從 items 移除舊欄位　4. 全部成功才記錄 meta/schema。
 * 任一步失敗就停止，舊欄位保留，讀取端仍可相容讀取，下次登入再繼續。 */
let migrationStarted = false;
const LEGACY_KEYS = ['reviewDraft','ai','ocr','ocrLog','ocrCount'];
const hasLegacy = it => (it.versions || []).some(v => LEGACY_KEYS.some(k => v[k] != null));
/* 欄位順序無關的比對（資料庫讀回後欄位順序可能不同） */
const canon = x => Array.isArray(x) ? '[' + x.map(canon).join(',') + ']' : (x && typeof x === 'object') ? '{' + Object.keys(x).filter(k => x[k] !== undefined).sort().map(k => JSON.stringify(k) + ':' + canon(x[k])).join(',') + '}' : JSON.stringify(x === undefined ? null : x);
const legacyOf = item => (item.versions || []).map(v => { const o = {v:v.v}; LEGACY_KEYS.forEach(k => { if (v[k] != null) o[k] = v[k]; }); return o; }).filter(o => Object.keys(o).length > 1);
let migrationReport = null;
async function migrateSchema(){
  const fail = async (step, itemId, err) => {
    migrationReport = {ok:false, step, itemId, err:String((err && (err.code || err.message)) || err || '')};
    /* 只記錄失敗，不標示為第 2 版；舊欄位保留，讀取端相容 */
    try { await db.doc('meta/schema').set({version:1, status:'轉換未完成', step, itemId, error:migrationReport.err, at:stamp(), by:me.id}); } catch (e){ /* ignore */ }
    return migrationReport;
  };
  let meta;
  try { meta = await db.doc('meta/schema').get(); } catch (e){ return fail('讀取轉換狀態', '', e); }
  const pending = Object.values(D.items).filter(hasLegacy);
  if (meta.exists && (meta.data().version || 0) >= SCHEMA_VERSION && !pending.length) return (migrationReport = {ok:true, moved:0});
  if (!(await withLease('meta/schema'))) return (migrationReport = {ok:false, step:'租約', err:'其他人正在轉換'});
  let moved = 0;
  for (const it0 of pending){
    const id = it0.id;
    /* 1. 從資料庫重讀這份文件，以資料庫內容為準 */
    let snap; try { snap = await db.doc('items/' + id).get(); } catch (e){ return fail('讀取文件', id, e); }
    if (!snap.exists) continue;
    const item = clone(snap.data()), legacy = legacyOf(item);
    if (!legacy.length) continue;
    /* 2. 備份並讀回驗證 */
    try {
      const bpath = 'backups/' + id + '__schema1', bs = await db.doc(bpath).get();
      const same = bs.exists && canon(legacyOf(bs.data().item || {})) === canon(legacy);
      if (!same){
        const target = bs.exists ? bpath + '_' + Date.now().toString(36) : bpath;
        await db.doc(target).set({item, at:stamp(), by:me.id, from:1, to:SCHEMA_VERSION});
        const chk = await db.doc(target).get();
        if (!chk.exists || canon(chk.data().item) !== canon(item)) return fail('驗證備份', id, '備份內容與原文件不一致');
      }
    } catch (e){ return fail('備份', id, e); }
    /* 3. 搬移草稿與 OCR，逐筆讀回驗證；新結構已有資料時以新結構為準（舊資料仍在備份） */
    try {
      for (const L of legacy){
        const k = wkey(id, L.v);
        if (L.reviewDraft){
          const ds = await db.doc('reviewDrafts/' + k).get();
          if (!ds.exists){
            const body = Object.assign({}, clone(L.reviewDraft), {itemId:id, caseId:item.caseId, v:L.v, schema:SCHEMA_VERSION, migratedFrom:1});
            await db.doc('reviewDrafts/' + k).set(body);
            const chk = await db.doc('reviewDrafts/' + k).get();
            if (!chk.exists || canon(chk.data().fields) !== canon(L.reviewDraft.fields)) return fail('驗證草稿', id, '草稿讀回內容不一致');
          }
        }
        if (L.ai || L.ocr || L.ocrLog || L.ocrCount){
          const os = await db.doc('ocrRuns/' + k).get();
          if (!os.exists){
            const body = {itemId:id, caseId:item.caseId, v:L.v, ai:L.ai || null, last:L.ocr || null, log:L.ocrLog || [], count:L.ocrCount || 0, schema:SCHEMA_VERSION, migratedFrom:1};
            await db.doc('ocrRuns/' + k).set(body);
            const chk = await db.doc('ocrRuns/' + k).get();
            if (!chk.exists || canon(chk.data().ai) !== canon(body.ai) || canon(chk.data().log) !== canon(body.log)) return fail('驗證 OCR', id, 'OCR 讀回內容不一致');
          }
        }
      }
    } catch (e){ return fail('搬移', id, e); }
    /* 4. 前面都確認成功後才移除舊欄位；若舊欄位在轉換期間被其他人改過，放棄這次移除 */
    const r = await mutateItem(id, null, x => {
      if (canon(legacyOf(x)) !== canon(legacy)) return '舊欄位在轉換期間有變動';
      x.versions.forEach(v => LEGACY_KEYS.forEach(k => { delete v[k]; }));
    });
    if (!r.ok) return fail('移除舊欄位', id, r.reason);
    moved++;
  }
  try { await db.doc('meta/schema').set({version:SCHEMA_VERSION, status:'完成', migratedAt:stamp(), by:me.id, moved}); } catch (e){ return fail('記錄完成', '', e); }
  if (moved) await addLog('', `資料結構轉換為第 ${SCHEMA_VERSION} 版：搬移 ${moved} 份文件的草稿與 OCR 結果（原資料已備份並驗證）`);
  return (migrationReport = {ok:true, moved});
}

/* ---------- 工作資料（草稿、OCR）的讀取：新結構優先，舊資料相容 ---------- */
function draftOf(it, v){ if (!it || !v) return null; return D.drafts[wkey(it.id, v.v)] || v.reviewDraft || null; }
function ocrOf(it, v){
  if (!it || !v) return {ai:null, last:null, count:0, log:[]};
  const d = D.ocr[wkey(it.id, v.v)];
  if (d) return {ai:d.ai || null, last:d.last || null, count:d.count || 0, log:d.log || []};

/* 第八項：必填欄位。標記 data-req 的 label／fieldset 會自動加上紅色半形 *，控制項加 aria-required；
 * 表單上方顯示「* 為必填欄位」。條件式必填由畫面切換 data-req。星號只標在實際有驗證的欄位。 */
function decorateRequired(root){
  if (!root) return;
  root.querySelectorAll('.req.auto').forEach(x => { const host = x.closest('[data-req]'); if (!host) x.remove(); });
  root.querySelectorAll(':scope :not(:is([data-req])) > .lbl, :scope :not(fieldset[data-req]) > legend > .lbl').forEach(w => { if (!w.closest('[data-req]')) w.replaceWith(document.createTextNode(w.textContent)); });
  root.querySelectorAll('[data-req]').forEach(l => {
    const tgt = l.tagName === 'FIELDSET' ? l.querySelector('legend') : l; if (!tgt) return;
    if (!tgt.querySelector(':scope > .req.auto')){
      const star = document.createElement('span'); star.className = 'req auto'; star.setAttribute('aria-hidden', 'true'); star.textContent = '*';
      /* 欄位名稱是文字節點時，包成一個行內區塊，讓 * 緊接在名稱右側（label 是直式排列） */
      const t = [...tgt.childNodes].find(n => (n.nodeType === 3 && n.textContent.trim()) || (n.nodeType === 1 && ['STRONG','SPAN'].includes(n.tagName) && !n.classList.contains('hint') && n.textContent.trim()));
      if (t && t.nodeType === 3){ const w = document.createElement('span'); w.className = 'lbl'; w.textContent = t.textContent.replace(/\s+$/, ''); w.appendChild(star); t.replaceWith(w); }
      else if (t) t.after(star); else tgt.prepend(star);
    }
    (l.tagName === 'FIELDSET' ? [...l.querySelectorAll('input,select,textarea')] : [l.querySelector('input,select,textarea')]).filter(Boolean).forEach(x => x.setAttribute('aria-required', 'true'));
  });
  root.querySelectorAll('form, .dialog').forEach(f => {
    const has = f.querySelector('[data-req]'), note = f.querySelector(':scope > .req-note');
    if (has && !note){ const p = document.createElement('p'); p.className = 'req-note small'; p.innerHTML = '<span class="req" aria-hidden="true">*</span> 為必填欄位<span class="sr">（標示星號的欄位必須填寫）</span>'; f.prepend(p); }
    if (!has && note) note.remove();
  });
}
/* 欄位旁的錯誤訊息（不清空其他已填欄位） */
function fieldErr(form, name, msg){
  const el = form && (form.querySelector(`[name="${name}"]`) || form.querySelector('#' + name)); if (!el) return;
  const id = 'fe-' + form.id + '-' + name; let box = document.getElementById(id);
  if (!msg){ el.removeAttribute('aria-invalid'); if (box) box.remove(); return; }
  if (!box){ box = document.createElement('div'); box.id = id; box.className = 'ferr'; box.setAttribute('role', 'alert'); (el.closest('label, fieldset') || el).after(box); }
  box.textContent = msg; el.setAttribute('aria-invalid', 'true'); el.setAttribute('aria-describedby', id);
}

async function hydrateFiles(){
  for (const img of document.querySelectorAll('[data-filedoc]')){
    const id = img.dataset.filedoc;
    try { if (!fileCache[id]){ const s = await db.doc('files/' + id).get(); fileCache[id] = s.exists ? s.data().dataUrl : ''; } if (fileCache[id]) img.src = fileCache[id]; } catch (e){ /* 顯示替代文字 */ }
  }
  for (const a of document.querySelectorAll('[data-filedoc-link]')){

  }
}

/* 補件 Email 通知：每一個正式補件事件（文件＋補件建立時間）只有一筆通知工作，id 固定，重試不會重複建立。
 * 測試環境沒有郵件服務：送出由 mailSend() 模擬，只會標示「模擬已寄送」，不代表家屬已收到真實電子郵件。

async function mailSend(m, opt){

async function mailEventFresh(m){

async function sendReqMail(id){

    if (x.status === '寄送中' && x.claim && Date.now() - (x.claim.ts || 0) < MAIL_CLAIM_MS) return `${accName(x.claim.by)} 正在寄送這筆通知，請稍後再查看結果`;
    if (x.status === '寄送中') x.attempts = (x.attempts || []).concat([{at:at0, ts:Date.now(), by:me.id, to:x.to, result:'前一次寄送沒有回寫結果（逾時），結果不明，重新認領'}]);

  const e1 = await mailEventFresh(D.mail[id] || m0);
  if (!e1.ok){
    await mutateDoc('mail', id, x => { if (!x.claim || x.claim.sendKey !== sendKey) return '寄送權已被其他人取得';
      x.attempts = (x.attempts || []).concat([{at:stamp(), ts:Date.now(), by:me.id, to:x.to, result:'取消寄送：' + e1.reason}]); x.status = m0.status === '寄送中' ? '寄送失敗' : m0.status; x.claim = null; }, {path:'mailQueue'});

    x.attempts = (x.attempts || []).concat([{at, ts, by:me.id, to:x.to, sendKey, result: res.ok ? '模擬已寄送（測試環境未實際寄出）' : '寄送失敗：' + res.error}]);

  if (!r.ok) return {ok:false, reason:'寄送結果寫入失敗：' + r.reason + '（狀態維持「寄送中」，約 2 分鐘後可以重試）'};

async function queueReqMail(c, it){

    if (!ex.exists){ if (!(await put('mailQueue/' + id, data))) return {ok:false, reason:'建立 Email 通知工作失敗'}; D.mail[id] = Object.assign({id}, data); }

/* ---------- 出生日期：民國或西元先轉成 YYYY/MM/DD 再比對；不以年齡推算，看不出完整日期就交由人工 ---------- */
function normBirth(raw){
  const t = String(raw || '').replace(/\s+/g, '').replace(/[．。]/g, '.');
  if (!t) return {state:'empty'};
  const real = (y, m, d) => { const dt = new Date(Date.UTC(y, m - 1, d)); return dt.getUTCFullYear() === y && dt.getUTCMonth() === m - 1 && dt.getUTCDate() === d; };
  const out = (y, m, d, how) => real(y, m, d) && y >= 1880 && y <= new Date().getFullYear() ? {state:'ok', iso:`${y}-${pad(m)}-${pad(d)}`, how} : {state:'bad', why:'日期不存在或年份不合理'};
  let m;
  if ((m = t.match(/(?:民國|民|ROC)(\d{1,3})[年./-](\d{1,2})[月./-](\d{1,2})日?/i))) return out(+m[1] + 1911, +m[2], +m[3], '民國 ' + m[1] + ' 年轉西元');
  if ((m = t.match(/(?:西元)?(\d{4})[年./-](\d{1,2})[月./-](\d{1,2})日?/))) return out(+m[1], +m[2], +m[3], '西元');
  if ((m = t.match(/^(\d{4})(\d{2})(\d{2})$/))) return out(+m[1], +m[2], +m[3], '西元');
  if ((m = t.match(/^(\d{2,3})[./-](\d{1,2})[./-](\d{1,2})$/))) return out(+m[1] + 1911, +m[2], +m[3], '年份 ' + m[1] + ' 視為民國年轉西元');
  if (/\d{1,3}歲/.test(t) || /年齡/.test(t)) return {state:'age', why:'只有年齡'};
  if (/\d/.test(t)) return {state:'partial', why:'日期不完整'};
  return {state:'bad', why:'看不出日期'};
}

  if (n.state !== 'ok') return {result:'待人工確認', note:'無法可靠解讀：' + n.why, n};

    } catch (e){ return fail('辨識時發生錯誤'); }

    await addLog(it.caseId, `${it.name} 第 ${verNo} 版第 ${entry.run} 次 AI 辨識成功（擷取 ${found.length} 欄，尚未確認）`);

      const onPage = route.page === 'review' && route.arg === it.id && reviewState && reviewState.id === it.id && reviewState.v === verNo;

      const merged = mergeAiDraft(it, draftFromState(st), fields, entry.run);

      st.src = 'AI 辨識'; st.aiRun = entry.run; st.dirty = true; st.editSeq = (st.editSeq || 0) + 1;

    if (r.validDays && doc.date){ v.dateConfirmed = doc.date; v.dateBy = staff; v.dateAt = dtAt; v.dateSrc = '行政依文件確認'; }
    if (r.medical && doc.fields){ v.fields = clone(doc.fields); v.nurseOk = true; v.nurseBy = nurse; v.nurseAt = nsAt; v.reviewSrc = '測試資料預先確認';
      const FD = fieldDefs(it).map(f => Object.assign({}, f, {val:doc.fields[f.k] || ''}));
      v.review = FD.map(f => !fActive(FD, f) ? {k:f.k, label:f.label, before:'', raw:'', after:'', auto:false, changed:false, edited:false, src:'依條件不適用', state:'不適用', fhir:fhirOf(f.k), by:nurse, at:nsAt} : {k:f.k, label:f.label, before:'', raw:f.val, after:f.val, auto:false, changed:false, edited:true, src:'測試資料預先確認', state:'已確認', absent: ABSENT_VALS.includes(f.val) ? f.val : '', fhir:fhirOf(f.k), run:null, okBy:nurse, okAt:nsAt, hist:[], by:nurse, at:nsAt});
      const labs = {}; FD.filter(f => f.type === 'labs' && fActive(FD, f)).forEach(f => { labs[f.k] = parseLabRows(f.val).rows; }); if (Object.keys(labs).length) v.labs = labs; v.fhir = null; }
    it.versions = [v];
  }
  /* 胸部 X 光沿用體檢報告的檔案（與家屬按「使用已上傳的體檢報告」相同的資料結構） */
  if (s.docs.xray && s.docs.xray.fromExam && items.exam.versions.length){
    const ev = items.exam.versions[0], x = s.docs.xray;
    items.xray.versions = [{v:1, at:upAt, by:fam, file:clone(ev.file), userDate:x.date, phase:'checked', fromItem:{id:s.id + '_exam', v:1, name:items.exam.name},
      idCheck:{by:staff, at:rcAt, how:'必要欄位全部相符', birth:birthRec({birth:'iso'}, slash(s.p.birth))}, dateConfirmed:x.date, dateBy:staff, dateAt:dtAt, dateSrc:'行政依文件確認',
      fields:clone(x.fields), nurseOk:true, nurseBy:nurse, nurseAt:nsAt, reviewSrc:'測試資料預先確認', review:[{k:'res', label:'判讀結果（照報告原文）', before:'', raw:x.fields.res, after:x.fields.res, auto:false, changed:false, edited:true, src:'測試資料預先確認', state:'已確認', absent:'', fhir:fhirOf('res'), run:null, okBy:nurse, okAt:nsAt, hist:[], by:nurse, at:nsAt}], fhir:null}];
  }
  if (fails.length) return {ok:false, fails, written};
  for (const k of Object.keys(items)){
    const id = s.id + '_' + k;
    if (await put('items/' + id, items[k])){ D.items[id] = Object.assign({id}, items[k]); written++; } else fails.push('文件項目：' + items[k].name);
  }
  if (fails.length) return {ok:false, fails, written};
  /* 3. 最後寫入案件主檔（測試案件固定編號；重複執行只會覆蓋同一筆，不會新增） */
  const c = {no:s.no, familyId:fam, relation:s.relation, patient:{name:s.p.name, nid:s.p.nid, birth:s.p.birth, chart:''}, hospital:TEST_HOSP, plannedAdmit:s.admit, flowMode:s.flow,
    docList:{status:'完成', at:at(-6, '20:10'), by:fam, count:DOC_LIST.length}, linkStatus:'已確認', nurseId:nurse, confirmedBy:staff, confirmedAt:at(-6, '09:30'), docDue:s.day(1),
    consent:{signer:'本人', at:at(-5, '21:00'), ver:CONSENT_VER, by:fam, needsProof:false, photo:false, emergency:true}, consentHistory:[{event:'簽署', ver:CONSENT_VER, signer:'本人', at:at(-5, '21:00'), by:fam}],
    assessment:null, signedAt:null, card:null, closed:null, life:{}, contacts:clone(s.contacts), createdAt:at(-7, '20:00'), createdTs:Date.now() - 7 * 864e5,
    test:{key:s.key, label:s.label, seededAt:stamp(), by:me.id}};
  if (s.assess) c.assessment = Object.assign({at:at(-1, '11:00'), by:nurse, mode:s.flow}, s.assess);
  if (s.signed){ c.signedAt = s.flow === '先簽後審' ? at(-4, '16:00') : at(-3, '16:00'); c.signedBy = staff; c.preDue = s.day(4); }
  if (s.flow === '先審後簽' && s.assess) c.assessment.at = at(-4, '11:00');
  /* 習慣卡為第一階段必填：測試案件的習慣卡都已正式提交；B、C、D 已完成護理初審，A 待護理初審 */
  if (s.habit){ const hAt = at(-4, '21:30'), hTs = Date.now() - 4 * 864e5;
    c.habit = {fmt:2, data:clone(s.habit), rev:1, updatedAt:hAt, updatedBy:fam, src:'家屬提供', secAt:Object.fromEntries(HABIT_SECS.map(x => [x.k, {at:hAt, by:fam}])),
      sub:{data:clone(s.habit), rev:1, at:hAt, ts:hTs, by:fam, n:1}, subHist:[{n:1, rev:1, at:hAt, ts:hTs, by:fam}]}; }
  D.cases[s.id] = Object.assign({id:s.id}, c);
  if (s.habit && s.habitReviewed){ const x = D.cases[s.id], rAt = at(-3, '15:20'), rTs = Date.now() - 3 * 864e5;
    const diffRes = cardDiffs(x).map(d => ({k:d.k, fam:d.fam, conf:d.conf, res:'測試資料：已電話向家屬確認，以醫院紀錄為準'}));
    c.habitReview = {state:'審核完成', rev:1, by:nurse, at:rAt, note:'測試資料預先完成初審', done:{rev:1, by:nurse, at:rAt, ts:rTs, note:'測試資料預先完成初審', snap:clone(s.habit), med:medSnap(x), diffRes}, hist:[{state:'審核完成', note:'測試資料預先完成初審', rev:1, by:nurse, at:rAt, ts:rTs, diffRes, changed:[]}]};
    D.cases[s.id] = Object.assign({id:s.id}, c); }
  if (s.openCard){
    const card = buildCard(D.cases[s.id]);
    Object.assign(card, {status:'已開放', v:1, ts:Date.now(), caregivers:s.openCard.slice(), hints:hintOptions(D.cases[s.id]), risk:'右側上肢無力，移位需一人協助；有跌倒風險', by:nurse, at:at(-1, '15:00'), review:{state:'有效', since:at(-1, '15:00'), fields:[]}});
    (card.pending || []).forEach(p => { p.show = true; }); delete card.habit;
    card.basis = cardBasis(D.cases[s.id]); c.card = card;
  }
  if (await put('cases/' + s.id, c)){ D.cases[s.id] = Object.assign({id:s.id}, c); written++; } else fails.push('案件主檔：' + s.p.name);
  await addLog(s.id, `${fails.length ? '測試資料建立未完成' : '建立測試資料'}：${s.label}（僅供測試）`);
  return {ok:!fails.length, fails, written};
}
function adminTestData(){
  const specs = testSpecs();
  return `<h1>測試資料（僅供測試）</h1>${purpose('只在簡化版測試環境使用。建立或恢復固定編號的虛構測試案件，方便直接從護理核對、收治評估、摘要卡與照服員畫面開始人工審核。不會在開啟頁面時自動執行，也不會影響其他案件。')}
  <div class="notice warn stack" style="margin-bottom:14px"><strong>僅供測試</strong><span class="small">所有住民、家屬、醫院與文件都是虛構的模擬資料。案件狀態是用完整資料建立（家屬上傳、行政核對、日期確認、護理確認），審核條件與正式流程相同。預先完成的護理確認標示為「測試資料預先確認」，不是 AI 辨識結果。</span></div>
  <div class="card tbl-wrap"><table><thead><tr><th>測試案件</th><th>家屬／護理</th><th>起始狀態</th><th>目前狀態</th><th></th></tr></thead><tbody>
  ${specs.map(s => { const c = D.cases[s.id]; return `<tr><td><strong>${esc(s.label)}</strong><br><span class="small">${esc(s.p.name)}（${esc(s.flow)}）</span><br><span class="small muted">${esc(s.use)}</span></td><td class="small">${esc(accName(s.family))}（${esc(s.relation)}）<br>${esc(accName(s.nurse))}${s.openCard ? '<br>照服員：' + esc(s.openCard.map(accName).join('、')) : ''}</td><td class="small">${esc(s.start)}</td><td>${c ? pill(phase(c), PHASE_TONE[phase(c)]) + (c.test ? `<br><span class="small muted">建立：${esc(c.test.seededAt)}</span>` : '') : pill('尚未建立', 'mute')}</td><td><button type="button" class="btn sm ${c ? '' : 'primary'}" data-act="test-seed" data-key="${s.key}">${c ? '恢復起始狀態' : '建立'}</button></td></tr>`; }).join('')}
  </tbody></table></div>
  <div class="row" style="margin-top:12px"><button type="button" class="btn" data-act="test-seed-missing">建立尚未存在的測試案件</button></div>
  <p class="small muted">限制：Claude 頁面資料庫沒有交易，資料是逐筆寫入；中途失敗會列出失敗項目，可以再按一次。恢復起始狀態只處理該筆測試案件（案件、文件項目、模擬文件圖片、核對草稿、辨識結果、通知），操作紀錄保留不刪。</p>`;
}
const TEST_ACT = {
  'test-seed': b => {
    if (me.role !== 'admin') return toast('只有系統管理員可以建立測試資料');
    const s = testSpec(b.dataset.key), fp = testFootprint(s);
    const affect = fp.exists ? `<p>會<strong>覆蓋或刪除</strong>以下「${esc(s.p.name)}」的測試資料，您在這筆案件上的人工操作都會被清除：</p><ul class="small"><li>案件主檔 ${esc(s.id)}</li><li>文件項目 ${fp.items.length} 份</li><li>模擬文件圖片 ${fp.files.length} 個</li><li>核對草稿 ${fp.drafts.length} 筆、辨識結果 ${fp.ocr.length} 筆</li><li>通知 ${fp.notices.length} 則</li></ul><p class="small muted">其他案件與帳號不受影響；操作紀錄保留。</p>` : `<p>會建立「${esc(s.label)}」：${esc(s.p.name)}（${esc(s.flow)}）。</p>`;
    modal({title: fp.exists ? `恢復起始狀態：${s.label}` : `建立：${s.label}`, body:`<p class="notice warn small">僅供測試</p>${affect}<p class="small">起始狀態：${esc(s.start)}</p>`, ok: fp.exists ? '確認恢復' : '建立', danger: fp.exists, onOk: async () => {
      setErr('merr', '處理中，請稍候…');
      const r = await seedTestCase(s.key);
      if (!r.ok){ setErr('merr', `未完成（已寫入 ${r.written} 筆）。失敗項目：${r.fails.join('、')}。可以再按一次。`); render(false); return; }
      closeModal(); toast(`已${fp.exists ? '恢復' : '建立'}：${s.label}`); render(false); }});
  },
  'test-seed-missing': b => {
    if (me.role !== 'admin') return toast('只有系統管理員可以建立測試資料');
    const miss = testSpecs().filter(s => !D.cases[s.id]);
    if (!miss.length) return toast('測試案件都已存在。要回到起始狀態，請按各案件的「恢復起始狀態」。');
    modal({title:'建立尚未存在的測試案件', body:`<p class="notice warn small">僅供測試</p><p>會建立：</p><ul class="small">${miss.map(s => `<li>${esc(s.label)}（${esc(s.p.name)}）</li>`).join('')}</ul><p class="small muted">已存在的測試案件不會被改動。</p>`, ok:'建立', onOk: async () => {
      setErr('merr', '處理中，請稍候…'); const bad = [];
      for (const s of miss){ const r = await seedTestCase(s.key); if (!r.ok) bad.push(`${s.label}：${r.fails.join('、')}`); }
      if (bad.length){ setErr('merr', '部分未完成。' + bad.join('；')); render(false); return; }
      closeModal(); toast(`已建立 ${miss.length} 筆測試案件`); render(false); }});
  }
};
Object.assign(ACT, TEST_ACT);

try { applyFont(localStorage.getItem('ltc-fs') || (localStorage.getItem('ltc-big') ? 'l' : 'm')); } catch (e){ applyFont('m'); }
document.addEventListener('click', e => { if (fsOpen && !e.target.closest('.fs-wrap')){ fsOpen = false; document.getElementById('top').innerHTML = topBar(); } });
document.addEventListener('keydown', e => { if (fsOpen && e.key === 'Escape'){ fsOpen = false; document.getElementById('top').innerHTML = topBar(); const b = document.querySelector('[data-act="fs-menu"]'); if (b) b.focus(); } });
(async () => {
  if (!window.claude || !claude.use){ showFatal('此頁面需要在 Claude 中開啟才能使用。'); return; }
  db = await claude.use('db');
  if (!db){ showFatal('無法連線到系統資料庫。請確認您已登入 Claude，且具有此頁面的使用權限。'); return; }
  const u = await claude.use('user');
